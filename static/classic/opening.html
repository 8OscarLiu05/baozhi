<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>保溯 · 条款可溯源寿险智能辅助平台</title>
<meta name="description" content="展业、客户自助、电话中心与平台运营共用一套可溯源的条款字段、证据与合规规则。">
<link rel="icon" href="/classic/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/classic/opening.css">
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-noise" aria-hidden="true"></div>

<header class="top-bar">
  <div class="brand">
    <img src="/classic/logo.svg" alt="" width="30" height="30">
    <span class="brand-text"><b>保溯</b><small>条款可溯源寿险辅助平台</small></span>
  </div>
</header>

<main class="stage">
  <section class="intro" aria-labelledby="opening-title">
    <p class="kicker"><span class="kicker-dot" aria-hidden="true"></span>保险智能体中台</p>
    <h1 id="opening-title">
      <span class="line line--1"><span class="inner">三个业务入口，</span></span>
      <span class="line line--swipe line--2"><span class="inner">一个保险智能体中台。</span><svg class="swipe" viewBox="0 0 100 12" preserveAspectRatio="none" aria-hidden="true"><path d="M1 8.5C18 3.5 52 2.5 99 7"/></svg></span>
    </h1>
    <p class="lede">展业、客户自助与电话中心的问题汇入同一个中台：先核对条款字段，再组织回答，每一次调用都留下编号与出处。</p>
    <div class="actions">
      <a class="cta" href="/classic/showcase.html">开始<span class="cta-arrow" aria-hidden="true">↗</span></a>
    </div>
    <p class="footnote">客户与保单均为虚构 · 公开条款仅用于核对，不作核保结论</p>
  </section>

  <section class="trace-wrap" aria-label="中台链路示意图">
    <div class="stage-parallax">
      <div class="stage-card">
        <div class="stage-head">
          <span class="stage-tag"><i aria-hidden="true"></i>TRACE · 现场链路</span>
        </div>
        <svg class="trace-svg" viewBox="0 0 600 560" role="img" aria-label="链路示意图：展业、客户自助与电话中心三个业务入口的问题汇入中台，返回字段命中、条款出处与调用编号，承诺话术被拦截留痕。">
          <defs>
            <pattern id="gridPat" width="26" height="26" patternUnits="userSpaceOnUse">
              <path d="M26 0H0V26" fill="none" stroke="#1B2027" stroke-width="1" opacity=".05"/>
            </pattern>
            <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#234E64" stop-opacity=".55"/>
              <stop offset="55%" stop-color="#234E64" stop-opacity=".16"/>
              <stop offset="100%" stop-color="#234E64" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="vig" cx="50%" cy="44%" r="64%">
              <stop offset="52%" stop-color="#FFFDF8" stop-opacity="0"/>
              <stop offset="100%" stop-color="#FFFDF8" stop-opacity=".92"/>
            </radialGradient>
          </defs>
          <rect width="600" height="560" fill="url(#gridPat)"/>
          <rect width="600" height="560" fill="url(#vig)"/>

          <!-- 角部定位标记 -->
          <g class="marks">
            <path d="M22 13v18M13 22h18M578 13v18M569 22h18M22 529v18M13 538h18M578 529v18M569 538h18"/>
          </g>

          <!-- 左：三个业务入口 -->
          <g class="entry entry--1">
            <rect class="node-box" x="20" y="58" width="140" height="84" rx="10"/>
            <rect class="tile-bg" x="34" y="76" width="36" height="36" rx="9"/>
            <g class="icon" transform="translate(42 90)"><rect x="4" y="3.5" width="12" height="15" rx="2"/><rect x="7.5" y="1.5" width="5" height="4" rx="1.2"/><path d="M7.5 10.5h5M7.5 14h3.5"/></g>
            <text class="n-name" x="82" y="96">展业</text>
            <text class="n-sub" x="82" y="118">CH-01 · 代理人</text>
          </g>
          <g class="entry entry--2">
            <rect class="node-box" x="20" y="244" width="140" height="84" rx="10"/>
            <rect class="tile-bg" x="34" y="262" width="36" height="36" rx="9"/>
            <g class="icon" transform="translate(42 276)"><rect x="5.5" y="2" width="9" height="16" rx="2.2"/><path d="M8.5 15.8h3"/></g>
            <text class="n-name" x="82" y="282">客户自助</text>
            <text class="n-sub" x="82" y="304">CH-02 · 手机端</text>
          </g>
          <g class="entry entry--3">
            <rect class="node-box" x="20" y="430" width="140" height="84" rx="10"/>
            <rect class="tile-bg" x="34" y="448" width="36" height="36" rx="9"/>
            <g class="icon" transform="translate(42 462)"><path d="M4 12.5a5.5 5.5 0 0 1 11 0"/><rect x="3" y="12" width="3.4" height="5" rx="1.4"/><rect x="12.6" y="12" width="3.4" height="5" rx="1.4"/><path d="M14.3 17v.6a2.4 2.4 0 0 1-2.4 2.4H10"/></g>
            <text class="n-name" x="82" y="468">电话中心</text>
            <text class="n-sub" x="82" y="490">CH-03 · 坐席</text>
          </g>

          <!-- 入口 → 中台 的链路 -->
          <path class="route route--in route--in--1" pathLength="100" d="M160 100 C 205 100, 212 226, 240 254"/>
          <path class="route route--in route--in--2" pathLength="100" d="M160 286 C 200 286, 208 286, 240 286"/>
          <path class="route route--in route--in--3" pathLength="100" d="M160 472 C 205 472, 212 346, 240 318"/>

          <!-- 中台核：暗色焦点 -->
          <circle class="core-flash" cx="300" cy="286" r="72" fill="url(#coreGlow)"/>
          <circle class="orbit" cx="300" cy="286" r="100"/>
          <g class="core-body">
            <rect class="core-box" x="240" y="226" width="120" height="120" rx="18"/>
            <image href="/classic/logo.svg" x="272" y="242" width="56" height="56"/>
            <text class="core-name" x="300" y="322" text-anchor="middle">保溯中台</text>
            <text class="core-sub" x="300" y="340" text-anchor="middle">AGENT PLATFORM</text>
          </g>

          <!-- 沿链路飞行的调用包 -->
          <g class="packets">
            <g class="packet packet--1"><circle r="9" opacity=".16"/><circle r="4.5"/></g>
            <g class="packet packet--2"><circle r="9" opacity=".16"/><circle r="4.5"/></g>
            <g class="packet packet--3"><circle r="9" opacity=".16"/><circle r="4.5"/></g>
          </g>

          <!-- 中台 → 证据 的链路 -->
          <path class="route route--out route--out--1" pathLength="100" d="M360 254 C 396 246, 402 136, 436 120"/>
          <path class="route route--out route--out--2" pathLength="100" d="M360 286 C 398 286, 406 286, 436 286"/>
          <path class="route route--out route--out--3" pathLength="100" d="M360 318 C 398 326, 402 440, 436 452"/>
          <path class="route route--out route--out--4" pathLength="100" d="M360 318 C 402 330, 410 512, 436 534"/>

          <!-- 右：带出处返回的证据 -->
          <g class="out-node out-node--1">
            <rect class="node-box" x="436" y="78" width="144" height="84" rx="10"/>
            <rect class="accent" x="448" y="96" width="3" height="48" rx="1.5"/>
            <text class="v-name" x="462" y="116">字段命中</text>
            <text class="v-sub" x="462" y="138">waiting_period=90d</text>
          </g>
          <g class="out-node out-node--2">
            <rect class="node-box" x="436" y="244" width="144" height="84" rx="10"/>
            <rect class="accent" x="448" y="262" width="3" height="48" rx="1.5"/>
            <text class="v-name" x="462" y="282">条款出处</text>
            <text class="v-sub" x="462" y="304">CLAUSE §2.3.1</text>
          </g>
          <g class="out-node out-node--3">
            <rect class="node-box" x="436" y="410" width="144" height="84" rx="10"/>
            <rect class="accent" x="448" y="428" width="3" height="48" rx="1.5"/>
            <text class="v-name" x="462" y="448">调用编号</text>
            <text class="v-sub" x="462" y="470">CALL a7f3c21b90de</text>
          </g>
          <g class="out-node out-node--4">
            <rect class="node-box" x="436" y="506" width="144" height="56" rx="10"/>
            <rect class="accent accent--seal" x="448" y="520" width="3" height="28" rx="1.5"/>
            <text class="v-name seal-ink" x="462" y="528">承诺拦截</text>
            <text class="v-sub" x="462" y="548">RISK · 话术留痕</text>
          </g>

          <!-- 链路节点 -->
          <g class="junction">
            <circle cx="160" cy="100" r="3.2"/><circle cx="160" cy="286" r="3.2"/><circle cx="160" cy="472" r="3.2"/>
            <circle cx="436" cy="120" r="3.2"/><circle cx="436" cy="286" r="3.2"/><circle cx="436" cy="452" r="3.2"/><circle cx="436" cy="534" r="3.2"/>
          </g>

          <!-- 落到中台门口的印 -->
          <g class="stamp">
            <rect x="334" y="352" width="128" height="50" rx="10" fill="#F6F3EC" fill-opacity=".94" stroke="#234E64" stroke-width="2.5"/>
            <rect x="339.5" y="357.5" width="117" height="39" rx="7" fill="none" stroke="#234E64" stroke-width="1" opacity=".5"/>
            <text class="stamp-t" x="398" y="376" text-anchor="middle">可追溯</text>
            <text class="stamp-s" x="398" y="392" text-anchor="middle">TRACED</text>
          </g>
        </svg>
      </div>
    </div>
  </section>
</main>

<div class="dock">
  <button class="dock-btn" type="button" data-motion-pause aria-pressed="false" aria-label="暂停动画" title="暂停动画">Ⅱ</button>
  <button class="dock-btn dock-btn--text" type="button" data-motion-replay aria-label="重播链路演示" title="重播链路演示">↻ <span>重播</span></button>
</div>

<script src="/classic/i18n.js" defer></script>
<script src="/classic/opening.js" defer></script>
</body>
</html>
